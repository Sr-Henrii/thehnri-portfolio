<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bs-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="bs-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="bs-card-highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <filter id="bs-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bs-bg)"/>

  <!-- Subtle Editorial Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="500" cy="180" r="140" fill="#22c55e" opacity="0.08" filter="url(#bs-blur)"/>

  <g transform="translate(40, 35)">
    <!-- Canvas Frame -->
    <rect width="720" height="430" rx="12" fill="#121212" stroke="#262626" stroke-width="1.5"/>

    <!-- Editorial Header -->
    <rect width="720" height="52" rx="12" fill="#181818"/>
    <rect y="40" width="720" height="12" fill="#181818"/>
    <line x1="0" y1="52" x2="720" y2="52" stroke="#262626" stroke-width="1"/>

    <text x="30" y="32" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="1">THEHNRI &middot; EDITORIAL STUDIO</text>
    <text x="320" y="32" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500">Curated Brand Voice &amp; Cultural Storytelling</text>

    <!-- Social / Publication Pill -->
    <rect x="580" y="15" width="115" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.3"/>
    <circle cx="592" cy="26" r="3" fill="#22c55e"/>
    <text x="602" y="30" fill="#22c55e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700">HIGH RESONANCE</text>

    <!-- Centerpiece Quote Card -->
    <g transform="translate(30, 75)">
      <rect width="400" height="210" rx="10" fill="url(#bs-card-highlight)" stroke="#2e2e2e" stroke-width="1"/>
      
      <!-- Big Quote Mark -->
      <text x="25" y="55" fill="#22c55e" font-family="Georgia, serif" font-size="54" font-weight="700" opacity="0.7">“</text>
      
      <text x="25" y="80" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="700" line-height="1.3">
        <tspan x="25" dy="0">Move people before you</tspan>
        <tspan x="25" dy="24">attempt to move products.</tspan>
      </text>

      <text x="25" y="145" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" line-height="1.5">
        <tspan x="25" dy="0">High-converting content isn't noise;</tspan>
        <tspan x="25" dy="18">it's personal resonance, shared values, and clarity.</tspan>
      </text>

      <g transform="translate(25, 175)">
        <rect width="120" height="20" rx="4" fill="#141414" stroke="#222222"/>
        <text x="10" y="14" fill="#22c55e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="700">BRAND POSITIONING</text>
      </g>
    </g>

    <!-- Storytelling Series Cards on Right -->
    <g transform="translate(450, 75)">
      <!-- Album Curation Series -->
      <rect width="240" height="98" rx="8" fill="url(#bs-card)" stroke="#262626" stroke-width="1"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.3"/>
      <text x="21" y="32" fill="#22c55e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13">&starf;</text>
      <text x="50" y="27" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700">Album Curation Series</text>
      <text x="50" y="40" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10">Music, visual art &amp; culture tie-ins</text>
      <text x="14" y="75" fill="#22c55e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600">&uarr; 4.8x Community Engagement</text>

      <!-- Community Narrative Series -->
      <g transform="translate(0, 112)">
        <rect width="240" height="98" rx="8" fill="url(#bs-card)" stroke="#262626" stroke-width="1"/>
        <rect x="14" y="14" width="28" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
        <text x="22" y="33" fill="#60a5fa" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14">&sect;</text>
        <text x="50" y="27" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700">Visibility Stories</text>
        <text x="50" y="40" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10">Documenting local SME transformations</text>
        <text x="14" y="75" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600">&bull; 100% Organic Reach Growth</text>
      </g>
    </g>

    <!-- Narrative Waveform / Resonance Metric Bar -->
    <g transform="translate(30, 305)">
      <rect width="660" height="100" rx="10" fill="url(#bs-card)" stroke="#222222" stroke-width="1"/>
      
      <text x="20" y="26" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">CONTENT RESONANCE SPECTRUM</text>

      <!-- Simulated waveform bars -->
      <g transform="translate(20, 42)">
        <rect x="0" y="20" width="6" height="25" rx="3" fill="#333333"/>
        <rect x="12" y="15" width="6" height="35" rx="3" fill="#333333"/>
        <rect x="24" y="8" width="6" height="48" rx="3" fill="#22c55e" opacity="0.6"/>
        <rect x="36" y="2" width="6" height="60" rx="3" fill="#22c55e"/>
        <rect x="48" y="10" width="6" height="44" rx="3" fill="#22c55e"/>
        <rect x="60" y="22" width="6" height="20" rx="3" fill="#333333"/>
        <rect x="72" y="12" width="6" height="40" rx="3" fill="#22c55e"/>
        <rect x="84" y="5" width="6" height="54" rx="3" fill="#22c55e"/>
        <rect x="96" y="18" width="6" height="28" rx="3" fill="#333333"/>
        <rect x="108" y="10" width="6" height="45" rx="3" fill="#22c55e"/>
        <rect x="120" y="2" width="6" height="60" rx="3" fill="#22c55e"/>
        <rect x="132" y="14" width="6" height="38" rx="3" fill="#22c55e" opacity="0.7"/>
        <rect x="144" y="22" width="6" height="22" rx="3" fill="#333333"/>
        <rect x="156" y="8" width="6" height="48" rx="3" fill="#22c55e"/>
        <rect x="168" y="0" width="6" height="65" rx="3" fill="#22c55e"/>
        <rect x="180" y="12" width="6" height="42" rx="3" fill="#22c55e"/>
        <rect x="192" y="25" width="6" height="15" rx="3" fill="#333333"/>
      </g>

      <g transform="translate(260, 48)">
        <text x="0" y="15" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700">High-Signal Narrative Distribution</text>
        <text x="0" y="32" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5">Optimized for WhatsApp shares, LinkedIn authority posts, and IG carousels</text>
      </g>
    </g>
  </g>
</svg>