<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hc-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="hc-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="hc-glow-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="hc-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#hc-bg)"/>

  <!-- Subtle Radial Grid Accent -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <circle cx="400" cy="250" r="100"/>
    <circle cx="400" cy="250" r="200"/>
    <circle cx="400" cy="250" r="300"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="680" cy="380" r="150" fill="#22c55e" opacity="0.09" filter="url(#hc-blur)"/>

  <g transform="translate(40, 35)">
    <!-- Main Frame -->
    <rect width="720" height="430" rx="12" fill="#121212" stroke="#262626" stroke-width="1.5"/>

    <!-- Header / Banner Area -->
    <rect width="720" height="70" rx="12" fill="#181818"/>
    <rect y="50" width="720" height="20" fill="#181818"/>
    <line x1="0" y1="70" x2="720" y2="70" stroke="#262626" stroke-width="1"/>

    <!-- Badge -->
    <rect x="30" y="22" width="130" height="26" rx="6" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.3"/>
    <text x="42" y="39" fill="#22c55e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">30-DAY SPRINT</text>

    <!-- Program Title -->
    <text x="175" y="40" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800">HEROES CHALLENGE</text>
    <text x="365" y="40" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500">&middot; Local Business Growth Accelerator</text>

    <!-- Progress Indicator Bar -->
    <g transform="translate(520, 20)">
      <text x="0" y="15" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600">SPRINT VELOCITY</text>
      <text x="130" y="15" fill="#22c55e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700">Day 18 / 30</text>
      <rect y="22" width="170" height="6" rx="3" fill="#222222"/>
      <rect y="22" width="112" height="6" rx="3" fill="url(#hc-glow-grad)"/>
    </g>

    <!-- Sprint Phases Row -->
    <!-- Phase 1 -->
    <g transform="translate(30, 95)">
      <rect width="210" height="150" rx="10" fill="url(#hc-card)" stroke="#262626" stroke-width="1"/>
      <rect x="16" y="16" width="30" height="20" rx="4" fill="#22c55e" fill-opacity="0.2"/>
      <text x="23" y="30" fill="#22c55e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700">P1</text>
      <text x="56" y="30" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700">Discovery Engine</text>
      
      <text x="16" y="65" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" line-height="1.4">
        <tspan x="16" dy="0">&check; Google Profile Audit</tspan>
        <tspan x="16" dy="20">&check; Local Keyword Clustering</tspan>
        <tspan x="16" dy="20">&check; Value Proposition Matrix</tspan>
      </text>
      
      <rect x="16" y="115" width="178" height="20" rx="5" fill="#181818" stroke="#22c55e" stroke-opacity="0.3"/>
      <text x="65" y="129" fill="#22c55e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700">&bull; COMPLETED</text>
    </g>

    <!-- Phase 2 (Active) -->
    <g transform="translate(255, 95)">
      <rect width="210" height="150" rx="10" fill="#1c1c1c" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="16" y="16" width="30" height="20" rx="4" fill="#22c55e"/>
      <text x="23" y="30" fill="#0d0d0d" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800">P2</text>
      <text x="56" y="30" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700">Trust Building</text>
      
      <text x="16" y="65" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">
        <tspan x="16" dy="0" fill="#22c55e">&check; Customer Review Funnel</tspan>
        <tspan x="16" dy="20" fill="#f5f5f7">&bull; Authority Content Drops</tspan>
        <tspan x="16" dy="20" fill="#8e8e93">&bull; Social Proof Flywheel</tspan>
      </text>
      
      <rect x="16" y="115" width="178" height="20" rx="5" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e"/>
      <text x="60" y="129" fill="#22c55e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700">▶ IN PROGRESS</text>
    </g>

    <!-- Phase 3 -->
    <g transform="translate(480, 95)">
      <rect width="210" height="150" rx="10" fill="url(#hc-card)" stroke="#222222" stroke-width="1"/>
      <rect x="16" y="16" width="30" height="20" rx="4" fill="#262626"/>
      <text x="23" y="30" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700">P3</text>
      <text x="56" y="30" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700">Scale &amp; Convert</text>
      
      <text x="16" y="65" fill="#666666" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">
        <tspan x="16" dy="0">&bull; Retargeting Strategy</tspan>
        <tspan x="16" dy="20">&bull; Direct Sales Pipelines</tspan>
        <tspan x="16" dy="20">&bull; Long-term Retention</tspan>
      </text>
      
      <rect x="16" y="115" width="178" height="20" rx="5" fill="#161616"/>
      <text x="68" y="129" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600">UPCOMING</text>
    </g>

    <!-- Daily Task Feed in the Challenge -->
    <g transform="translate(30, 260)">
      <rect width="660" height="145" rx="10" fill="url(#hc-card)" stroke="#222222" stroke-width="1"/>
      
      <text x="22" y="30" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LIVE CHALLENGE LOG &middot; DAILY ACTIONABLE TASKS</text>
      
      <!-- Task Row 1 -->
      <g transform="translate(22, 45)">
        <rect width="616" height="38" rx="6" fill="#161616" stroke="#222222"/>
        <circle cx="20" cy="19" r="6" fill="#22c55e"/>
        <text x="36" y="23" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Day 17: Build a high-converting WhatsApp business catalog &amp; quick-reply funnel</text>
        <rect x="520" y="8" width="80" height="22" rx="4" fill="#22c55e" fill-opacity="0.15"/>
        <text x="532" y="23" fill="#22c55e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700">SUBMITTED</text>
      </g>

      <!-- Task Row 2 -->
      <g transform="translate(22, 92)">
        <rect width="616" height="38" rx="6" fill="#1c1c1c" stroke="#333333"/>
        <circle cx="20" cy="19" r="6" fill="#f59e0b"/>
        <text x="36" y="23" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Day 18: Deploy 3-part micro-case study thread across LinkedIn and Instagram</text>
        <rect x="520" y="8" width="80" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
        <text x="534" y="23" fill="#f59e0b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700">DUE TODAY</text>
      </g>
    </g>
  </g>
</svg>