<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="og-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <filter id="og-blur-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Glowing Accents -->
  <circle cx="1050" cy="150" r="240" fill="#22c55e" opacity="0.14" filter="url(#og-blur-1)"/>
  <circle cx="150" cy="500" r="280" fill="#22c55e" opacity="0.06" filter="url(#og-blur-1)"/>

  <!-- Subtle Minimal Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>

  <!-- Content Container -->
  <g transform="translate(120, 100)">
    <!-- Top Bar: Available Badge & Location -->
    <g transform="translate(0, 0)">
      <rect width="210" height="36" rx="18" fill="#181818" stroke="#262626" stroke-width="1"/>
      <circle cx="20" cy="18" r="4.5" fill="#22c55e"/>
      <text x="34" y="23" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600">Available for projects</text>
      
      <text x="240" y="23" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="2">EKET, AKWA IBOM &middot; GLOBAL</text>
    </g>

    <!-- Brand Identity Big Headline -->
    <text x="0" y="140" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">THEHNRI</text>
    
    <text x="0" y="200" fill="#22c55e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">
      Digital Creative &amp; Brand Strategist
    </text>
    
    <text x="0" y="250" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="400" line-height="1.5">
      Founder of Webtellisense &middot; SEO, Web Design, Storytelling &amp; Visibility Architecture
    </text>

    <!-- Bottom Features Card Box -->
    <g transform="translate(0, 310)">
      <rect width="960" height="85" rx="12" fill="url(#og-card)" stroke="#222222" stroke-width="1.5"/>
      
      <!-- Feature 1 -->
      <g transform="translate(30, 28)">
        <circle cx="12" cy="14" r="4" fill="#22c55e"/>
        <text x="26" y="19" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Webtellisense Agency</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(330, 28)">
        <circle cx="12" cy="14" r="4" fill="#22c55e"/>
        <text x="26" y="19" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Heroes 30-Day Growth</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(640, 28)">
        <circle cx="12" cy="14" r="4" fill="#22c55e"/>
        <text x="26" y="19" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Creative Mentorship</text>
      </g>
    </g>
  </g>
</svg>