<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="wb-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="wb-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="wb-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="chart-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#wb-bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="700" cy="120" r="140" fill="#22c55e" opacity="0.12" filter="url(#blur-glow)"/>
  <circle cx="150" cy="400" r="160" fill="#22c55e" opacity="0.06" filter="url(#blur-glow)"/>

  <!-- Browser Window Frame -->
  <g transform="translate(40, 40)">
    <!-- Window Outline & Fill -->
    <rect width="720" height="420" rx="12" fill="#121212" stroke="#262626" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="720" height="44" rx="12" fill="#181818"/>
    <rect y="32" width="720" height="12" fill="#181818"/>
    <line x1="0" y1="44" x2="720" y2="44" stroke="#262626" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="24" cy="22" r="5" fill="#ff5f56" opacity="0.8"/>
    <circle cx="40" cy="22" r="5" fill="#ffbd2e" opacity="0.8"/>
    <circle cx="56" cy="22" r="5" fill="#27c93f" opacity="0.8"/>

    <!-- URL Bar -->
    <rect x="180" y="10" width="360" height="24" rx="6" fill="#0d0d0d" stroke="#222222" stroke-width="1"/>
    <circle cx="200" cy="22" r="3" fill="#22c55e"/>
    <text x="214" y="26" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500">webtellisense.com/visibility-engine</text>

    <!-- App Header inside Mockup -->
    <text x="35" y="85" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3">Webtellisense Platform</text>
    <text x="35" y="105" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="400">Visibility Engine &amp; Growth Intelligence</text>
    
    <!-- Live Status Badge -->
    <rect x="580" y="70" width="105" height="26" rx="13" fill="#1a2e1f" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="594" cy="83" r="3.5" fill="#22c55e"/>
    <text x="604" y="87" fill="#4ade80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600">LIVE ENGINE</text>

    <!-- Metric Card 1: Visibility Score -->
    <g transform="translate(35, 125)">
      <rect width="205" height="100" rx="10" fill="url(#wb-card)" stroke="#222222" stroke-width="1"/>
      <text x="18" y="32" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">VISIBILITY SCORE</text>
      <text x="18" y="70" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800">98.4<tspan font-size="16" fill="#22c55e" font-weight="600"> /100</tspan></text>
      <path d="M150 64 L162 50 L174 56 L190 38" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="190" cy="38" r="3" fill="#22c55e"/>
    </g>

    <!-- Metric Card 2: Organic Discovery -->
    <g transform="translate(258, 125)">
      <rect width="205" height="100" rx="10" fill="url(#wb-card)" stroke="#222222" stroke-width="1"/>
      <text x="18" y="32" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">ORGANIC REACH</text>
      <text x="18" y="70" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800">+340%</text>
      <text x="135" y="68" fill="#22c55e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600">▲ MoM</text>
    </g>

    <!-- Metric Card 3: Google Business -->
    <g transform="translate(480, 125)">
      <rect width="205" height="100" rx="10" fill="url(#wb-card)" stroke="#222222" stroke-width="1"/>
      <text x="18" y="32" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">LOCAL RANKING</text>
      <text x="18" y="70" fill="#f5f5f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800">#1 Spot</text>
      <text x="135" y="68" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Eket &middot; Uyo</text>
    </g>

    <!-- Growth Graph & Strategy Visual -->
    <g transform="translate(35, 242)">
      <rect width="650" height="150" rx="10" fill="url(#wb-card)" stroke="#222222" stroke-width="1"/>
      
      <text x="20" y="28" fill="#8e8e93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">CLIENT CONVERSION VELOCITY &middot; 30-DAY TRAJECTORY</text>
      
      <!-- Graph Grid Lines -->
      <line x1="20" y1="50" x2="630" y2="50" stroke="#1d1d1d" stroke-width="1"/>
      <line x1="20" y1="85" x2="630" y2="85" stroke="#1d1d1d" stroke-width="1"/>
      <line x1="20" y1="120" x2="630" y2="120" stroke="#1d1d1d" stroke-width="1"/>
      
      <!-- Graph Fill & Stroke -->
      <path d="M 30 125 Q 120 115, 200 95 T 380 65 T 520 40 T 620 25 L 620 140 L 30 140 Z" fill="url(#chart-grad)"/>
      <path d="M 30 125 Q 120 115, 200 95 T 380 65 T 520 40 T 620 25" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Data Points -->
      <circle cx="200" cy="95" r="4" fill="#22c55e" stroke="#121212" stroke-width="2"/>
      <circle cx="380" cy="65" r="4" fill="#22c55e" stroke="#121212" stroke-width="2"/>
      <circle cx="520" cy="40" r="4" fill="#22c55e" stroke="#121212" stroke-width="2"/>
      <circle cx="620" cy="25" r="5" fill="#ffffff" stroke="#22c55e" stroke-width="3"/>
    </g>
  </g>
</svg>